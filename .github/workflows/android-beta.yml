name: Android Beta APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FlightConnect-beta-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct-download beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlightConnect-beta.apk
          if gh release view beta-latest >/dev/null 2>&1; then
            gh release upload beta-latest FlightConnect-beta.apk --clobber
          else
            gh release create beta-latest FlightConnect-beta.apk --title "FlightConnect Beta (latest)" --notes "Latest automatically built Android beta APK. Debug-signed; install only if you trust this repository." --prerelease
          fi
